<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rainy Knox County - artwork preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080d10;color:#c8ccca;font-family:Georgia,serif;overflow:hidden}.art{position:fixed;inset:0;background:url('DeadSignalFastLoad/42/media/textures/FastLoad_KnoxCounty.png') center/cover}canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}.title{position:absolute;left:6vw;top:14vh;max-width:35vw;text-shadow:0 3px 20px #000}.title small{font:11px monospace;letter-spacing:.25em;color:#98a09a}.title h1{font-size:clamp(28px,4vw,74px);line-height:.95;letter-spacing:-.04em;color:#deded4;margin:20px 0}.title p{font-size:clamp(13px,1.2vw,18px);color:#a9ada8;line-height:1.6}footer{position:absolute;bottom:24px;left:6vw;right:6vw;display:flex;align-items:center;gap:20px;font:12px monospace;color:#9ea7a4}button{background:#131d21dc;border:1px solid #506060;color:#e0e3dc;padding:10px 16px;cursor:pointer}button:focus-visible{outline:2px solid #d3c191}@media(prefers-reduced-motion:reduce){.art{animation:none}}
</style><div class="art"></div><canvas id="weather"></canvas><div class="title"><small>KNOX COUNTY, KENTUCKY</small><h1>PROJECT<br>ZOMBOID</h1><p>The street is quiet.<br>It won't stay that way.</p></div><footer><button id="motion">Pause animation</button><span>Artwork preview. In game, the native logo and working menu remain.</span></footer>
<script>
const canvas=document.getElementById('weather'),ctx=canvas.getContext('2d'),button=document.getElementById('motion');let still=matchMedia('(prefers-reduced-motion: reduce)').matches;const start=performance.now();function label(){button.textContent=still?'Play animation':'Pause animation'}label();button.onclick=()=>{still=!still;label()};function frame(now){let w=innerWidth,h=innerHeight;if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}ctx.clearRect(0,0,w,h);let t=still?0:(now-start)/1000;for(let i=0;i<8;i++){let drift=Math.sin(t*.1+i*.8)*.08;ctx.fillStyle='rgba(102,115,110,.018)';ctx.fillRect((.34+drift)*w,(.57+i*.014)*h,.72*w,.024*h)}let sweep=(Math.sin(t*.16)+1)*.5;for(let i=0;i<8;i++){ctx.fillStyle='rgba(171,166,112,.012)';ctx.fillRect((.48+sweep*.18-i*.006)*w,(.69+i*.006)*h,(.12+i*.018)*w,.003*h)}if(!still){for(let i=1;i<=48;i++){let x=(i*.6180339+t*.018)%1,y=(i*.4142136+t*(.15+(i%4)*.018))%1;ctx.strokeStyle=`rgba(130,153,156,${.045+(i%3)*.012})`;ctx.beginPath();ctx.moveTo(x*w,y*h);ctx.lineTo((x-.006)*w,(y+.022)*h);ctx.stroke()}}requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script>
<style>
.tip{position:absolute;right:6vw;bottom:110px;width:min(550px,43vw);padding:22px 24px;background:#091215e8;border-left:2px solid #9a8758}.tip header{font:11px monospace;letter-spacing:.12em;color:#b7ab8a;margin-bottom:12px}.tip p{font:clamp(15px,1.3vw,21px)/1.5 Georgia,serif;margin:0 0 18px;color:#d3d8d1}.tip nav{display:flex;gap:8px}.tip button{padding:6px 10px;font:12px monospace}@media(max-width:700px){.tip{right:5vw;bottom:95px;width:90vw}.title{top:8vh;max-width:80vw}.title p{display:none}footer span{display:none}}
</style>
<article class="tip" id="tip"><header id="tip-heading"></header><p id="tip-text"></p><nav><button id="previous">Previous</button><button id="next">Next tip</button><button id="hold">Pause tips</button></nav></article>
<script src="startup-preview-tips.js"></script>
<script>
// Development preview only. Native save loading retains its own random picker.
const pool=window.survivalTips,order=pool.map((_,i)=>i);for(let i=order.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}let tipPosition=0,tipPaused=false,hovering=false;const card=document.getElementById('tip');function showTip(){const item=pool[order[tipPosition]];document.getElementById('tip-heading').textContent=`SURVIVAL / ${item.category} / ${tipPosition+1} of ${pool.length}`;document.getElementById('tip-text').textContent=item.text}document.getElementById('next').onclick=()=>{tipPosition=(tipPosition+1)%pool.length;showTip()};document.getElementById('previous').onclick=()=>{tipPosition=(tipPosition+pool.length-1)%pool.length;showTip()};document.getElementById('hold').onclick=()=>{tipPaused=!tipPaused;document.getElementById('hold').textContent=tipPaused?'Resume tips':'Pause tips'};card.onmouseenter=()=>hovering=true;card.onmouseleave=()=>hovering=false;setInterval(()=>{if(!tipPaused&&!hovering){tipPosition=(tipPosition+1)%pool.length;showTip()}},12000);showTip();
</script></html>
